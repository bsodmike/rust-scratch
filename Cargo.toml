[package]
name = "scratchpad"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"

[lints.rust]
dead_code = "allow"

[[example]]
name = "iterators"
path = "examples/iterators.rs"